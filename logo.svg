<svg width="64" height="64" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <title>uvllang Logo</title>
  <desc>Compact circular technical logo with a grid-forward background</desc>
  
  <defs>
    <pattern id="gridA" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M 0 23 L 46 23" fill="none" stroke="#f92672" stroke-opacity="0.22" stroke-width="1.8"/>
    </pattern>
    <pattern id="gridB" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <path d="M 0 23 L 46 23" fill="none" stroke="#f92672" stroke-opacity="0.14" stroke-width="1.45"/>
    </pattern>
    <clipPath id="circleClip">
      <circle cx="340" cy="340" r="320"/>
    </clipPath>
  </defs>
  
  <circle cx="340" cy="340" r="320" fill="#0a0e14"/>
  
  <g clip-path="url(#circleClip)">
    <rect x="20" y="20" width="640" height="640" fill="url(#gridA)"/>
    <rect x="20" y="20" width="640" height="640" fill="url(#gridB)"/>
    
    <text x="250" y="398" font-family="'Courier New', monospace" font-size="108" font-weight="600" fill="#5c6370" letter-spacing="0" opacity="0.58">
      lang
    </text>
    
    <text x="150" y="356" font-family="'Courier New', monospace" font-size="198" font-weight="700" fill="#f92672" letter-spacing="-10">
      uvl
    </text>
  </g>
  
  <circle cx="340" cy="340" r="320" fill="none" stroke="#f92672" stroke-width="4"/>
  
</svg>