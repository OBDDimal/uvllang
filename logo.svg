<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <title>uvllang</title>
  <desc>Banner logo with a grid-forward technical background</desc>

  <defs>
    <pattern id="gridA" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M 0 23 L 46 23" fill="none" stroke="#f92672" stroke-opacity="0.22" stroke-width="1.8"/>
    </pattern>
    <pattern id="gridB" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <path d="M 0 23 L 46 23" fill="none" stroke="#f92672" stroke-opacity="0.14" stroke-width="1.45"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="200" fill="#0a0e14"/>
  <rect x="0" y="0" width="1200" height="200" fill="url(#gridA)"/>
  <rect x="0" y="0" width="1200" height="200" fill="url(#gridB)"/>

  <text x="600" y="128" font-family="'Courier New', monospace" font-size="90" font-weight="700" fill="#f92672" letter-spacing="-4" text-anchor="middle">
    uvl<tspan dx="-14" fill="#5c6370" font-weight="600" opacity="0.75">lang</tspan>
  </text>

  <rect x="0" y="196" width="1200" height="4" fill="#f92672"/>
</svg>
