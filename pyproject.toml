[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uvllang"
version = "0.3.1"
description = "Parser for the Universal Variability Language (UVL) with conversion support to CNF/SMT"
readme = "README.md"
license = "LGPL-3.0-or-later"
authors = [
    {name = "h3ssto", email = "tobias.hess@variability.dev"},
    {name = "UVL Team", email = "jagalindo@us.es"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.0"
dependencies = [
    "lark>=1.1.0",
    "python-sat>=0.1.8.dev13",
]

[project.optional-dependencies]
antlr = [
    "antlr4-python3-runtime==4.13.1",
]
dev = [
    "pytest>=7.0",
    "z3-solver>=4.12.0",
]

# uvl2cnf/uvl2uvl/uvl2smt/any2uvl are NOT Python entry points: they're the
# native binaries at parser/zig-out/bin/{uvl2cnf,uvl2uvl,uvl2smt,any2uvl}
# (built by `zig build` in parser/), installed onto PATH (e.g. into
# .venv/bin/) via setup.py's scripts=, not generated as entry-point
# wrapper scripts by setuptools -- see uvllang/cli.py's module docstring.
# The legacy Lark/ANTLR-backed uvl2smt CLI this replaced is still
# reachable programmatically via UVL(backend="lark"/"antlr").to_smt(), and
# UVL.from_cnf(...) still wraps any2uvl's algorithm via ctypes for
# programmatic use.

[tool.setuptools.packages.find]
where = ["."]
include = ["uvllang*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
uvllang = ["../grammars/uvl.lark"]

[tool.setuptools]
py-modules = []